<meta charset="utf-8">
<title>PSA Resit Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a ward drug chart. Sidebar of days, a paper-white working column; prescribing items render as a chart grid. */
:root {
  --paper: #f4f6f3;
  --surface: #ffffff;
  --ink: #17212b;
  --muted: #5a6670;
  --rule: #d6dbd4;
  --accent: #1f4b9e;          /* prescriber's blue ink */
  --accent-ink: #ffffff;
  --accent-soft: #e5ecf8;
  --chart: #fbf1e4;           /* drug-chart cream */
  --chart-head: #efd6bd;
  --good: #1d7349; --good-soft: #e1f2e8;
  --part: #8a5a00; --part-soft: #fbefd6;
  --bad: #b02a22;  --bad-soft: #fbe6e3;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1418; --surface: #171e24; --ink: #e5eaee; --muted: #9aa6b0; --rule: #2b353e;
    --accent: #8fb1f5; --accent-ink: #0d1726; --accent-soft: #1b2940;
    --chart: #241e17; --chart-head: #45362a;
    --good: #67d29a; --good-soft: #15301f; --part: #f0bd5a; --part-soft: #352812; --bad: #ff8b80; --bad-soft: #3a1c19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1418; --surface: #171e24; --ink: #e5eaee; --muted: #9aa6b0; --rule: #2b353e;
  --accent: #8fb1f5; --accent-ink: #0d1726; --accent-soft: #1b2940;
  --chart: #241e17; --chart-head: #45362a;
  --good: #67d29a; --good-soft: #15301f; --part: #f0bd5a; --part-soft: #352812; --bad: #ff8b80; --bad-soft: #3a1c19;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.6 var(--font-body); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.3rem); }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.08rem; margin-top: 1.6em; }
p { margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.87rem; }
.nowrap { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.eyebrow { font: 500 0.74rem/1.3 var(--font-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 650; font-size: 1.1rem; display: flex; align-items: baseline; gap: 8px; }
.brand small { font: 500 0.7rem var(--font-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
#countdown { font-size: 0.88rem; color: var(--muted); text-align: right; }
#countdown b { color: var(--ink); font-size: 1.05rem; }
.shell { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; }
#nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); align-self: start; }
.nav-item { all: unset; cursor: pointer; display: grid; grid-template-columns: 1fr auto; column-gap: 8px; padding: 8px 10px; border-radius: var(--r); border-left: 3px solid transparent; }
.nav-item:hover { background: var(--accent-soft); }
.nav-item:focus-visible { outline: 2px solid var(--accent); }
.nav-item.on { background: var(--accent-soft); border-left-color: var(--accent); }
.nav-label { font-weight: 600; }
.nav-sub { grid-column: 1; font-size: 0.8rem; color: var(--muted); line-height: 1.3; }
.nav-item .pill { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
#app { min-width: 0; display: flex; flex-direction: column; gap: 20px; }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 12px 56px; }
  #nav { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: thin; }
  .nav-item { flex: 0 0 auto; border-left: 0; border-bottom: 3px solid transparent; background: var(--surface); border-radius: var(--r) var(--r) 0 0; }
  .nav-item.on { border-bottom-color: var(--accent); }
  .nav-sub { display: none; }
  .brand small { display: none; }
}

/* building blocks */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.quiet { background: transparent; }
.hero { display: flex; flex-direction: column; gap: 12px; padding-block: 8px 4px; }
.lede { max-width: 62ch; color: var(--muted); }
.day-head { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.btn { font: 600 0.92rem var(--font-body); padding: 9px 16px; border-radius: var(--r); border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 5px 11px; font-size: 0.84rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.flagged { background: var(--part-soft); border-color: var(--part); color: var(--part); }
.link { all: unset; cursor: pointer; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.link:focus-visible { outline: 2px solid var(--accent); }
.link.danger { color: var(--bad); }
.pill { font: 500 0.72rem/1 var(--font-data); padding: 4px 7px; border-radius: 99px; white-space: nowrap; background: var(--accent-soft); color: var(--accent); }
.pill-good { background: var(--good-soft); color: var(--good); }
.pill-bad { background: var(--bad-soft); color: var(--bad); }
.pill-accent { background: var(--accent); color: var(--accent-ink); }
.warn { color: var(--part); }
.tight { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }

/* tables */
.tbl { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 500 0.72rem var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.hi td { background: var(--accent-soft); font-weight: 600; }
tr.today td { background: var(--accent-soft); }
tr.exam td { border-top: 2px solid var(--ink); }
td.good { color: var(--good); font-weight: 600; } td.bad { color: var(--bad); font-weight: 600; } td.part { color: var(--part); font-weight: 600; }

/* plan */
.dates { display: flex; flex-wrap: wrap; gap: 16px; }
.dates label { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
input[type="date"], select, .calc input { font: 0.95rem var(--font-body); padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); color: var(--ink); }
.mastery { display: flex; flex-direction: column; gap: 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) 3.2rem; gap: 12px; align-items: center; }
.mname { font-size: 0.9rem; }
.bar { position: relative; height: 10px; background: var(--paper); border: 1px solid var(--rule); border-radius: 99px; overflow: hidden; }
.bar span { position: absolute; inset: 0 auto 0 0; background: var(--muted); border-radius: 99px; }
.bar span.good { background: var(--good); } .bar span.ok { background: var(--accent); } .bar span.bad { background: var(--bad); }
.bar i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: 0.35; }
.mval { text-align: right; font-weight: 600; }
@media (max-width: 560px) { .mrow { grid-template-columns: minmax(0, 1fr) 3rem; } .bar { grid-column: 1 / -1; grid-row: 2; } }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tab { all: unset; cursor: pointer; padding: 9px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); }

/* lesson */
.lesson { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 4px 24px 24px; min-width: 0; }
.lesson p, .lesson ul, .lesson ol { max-width: 68ch; margin-top: 0.7em; }
.lesson ul, .lesson ol { padding-left: 1.3em; }
.lesson li + li { margin-top: 0.3em; }
.lesson .tbl { margin-top: 0.8em; }
.lesson .note { background: var(--accent-soft); border-radius: var(--r); padding: 10px 14px; font-size: 0.9rem; max-width: none; }
.steps { counter-reset: s; list-style: none; padding-left: 0 !important; }
.steps li { counter-increment: s; position: relative; padding-left: 2.2em; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0.1em; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 600 0.78rem/1.5em var(--font-data); text-align: center; }
.formula { font: 500 1rem var(--font-data); background: var(--chart); border: 1px dashed var(--chart-head); padding: 12px 16px; border-radius: var(--r); }
@media (max-width: 560px) { .lesson { padding: 2px 16px 18px; } }

/* recall cards */
.cards { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 12px; }
.flash { border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); }
.fq { font-weight: 600; }
.fa { color: var(--good); font-weight: 500; }
.flash .btn { align-self: flex-start; }

/* drills */
.drill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: 10px; }
.drill { all: unset; cursor: pointer; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.drill:hover { border-color: var(--accent); }
.drill:focus-visible { outline: 2px solid var(--accent); }
.drill-name { font-weight: 600; }
.drill-meta { font-size: 0.82rem; color: var(--muted); }

/* runner */
.runbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.run-pos { font-size: 0.9rem; font-weight: 600; }
.timer { font: 500 1.4rem var(--font-data); padding: 4px 12px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
.timer.low { color: var(--bad); border-color: var(--bad); }
.progress { height: 4px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); }
.navgrid { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 14px; }
.navgrid summary { cursor: pointer; font-size: 0.88rem; font-weight: 600; }
.ng-wrap { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.ng-sec { display: flex; flex-direction: column; gap: 4px; }
.ng-label { font-size: 0.74rem; color: var(--muted); }
.ng-row { display: flex; flex-wrap: wrap; gap: 4px; }
.ng { all: unset; cursor: pointer; width: 2.1rem; height: 2rem; text-align: center; line-height: 2rem; font: 500 0.78rem/2rem var(--font-data); border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); }
.ng.ans { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.ng.flag { box-shadow: inset 0 -3px 0 var(--part); }
.ng.cur { outline: 2px solid var(--ink); }
.ng:focus-visible { outline: 2px solid var(--accent); }

.q { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stem { font-size: 1rem; max-width: 70ch; }
.task { font-weight: 700; max-width: 70ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; }
.facts div { border: 1px solid var(--rule); border-radius: var(--r); padding: 6px 10px; background: var(--paper); }
.facts dt { font: 500 0.68rem var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; font-size: 0.9rem; }

.chart { border: 1.5px solid var(--chart-head); border-radius: var(--r); background: var(--chart); overflow: hidden; }
.chart-head, .chart-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; padding: 7px 12px; font: 500 0.74rem var(--font-data); letter-spacing: 0.04em; }
.chart-head { background: var(--chart-head); text-transform: uppercase; }
.chart-foot { border-top: 1px dashed var(--chart-head); color: var(--muted); }
.chart-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1.6fr; }
.cell { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-right: 1px dashed var(--chart-head); min-width: 0; }
.cell:last-child { border-right: 0; }
.cell-label { font: 500 0.68rem var(--font-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.cell select { width: 100%; font-family: var(--font-data); font-size: 0.86rem; color: var(--accent); background: var(--surface); }
@media (max-width: 680px) { .chart-grid { grid-template-columns: 1fr 1fr; } .cell:nth-child(2) { border-right: 0; } .cell:nth-child(-n+2) { border-bottom: 1px dashed var(--chart-head); } }

.rxlist td:first-child { font-family: var(--font-data); color: var(--muted); width: 2em; }
.part { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.part legend { font-weight: 700; padding: 0; margin-bottom: 8px; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--rule); border-radius: var(--r); cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.ol { font: 500 0.78rem/1.6 var(--font-data); color: var(--muted); min-width: 1.1em; }
fieldset:disabled .opt { cursor: default; }
.calc { display: flex; align-items: center; gap: 10px; }
.calc input { width: 10rem; font-family: var(--font-data); font-size: 1.1rem; }
.unit { font: 500 0.95rem var(--font-data); color: var(--muted); }

.feedback { border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; border: 1px solid; min-width: 0; }
.feedback.good { background: var(--good-soft); border-color: var(--good); }
.feedback.part { background: var(--part-soft); border-color: var(--part); }
.feedback.bad { background: var(--bad-soft); border-color: var(--bad); }
.fb-score { font-size: 1rem; }
.fb-score b { font-size: 1.2rem; margin-right: 6px; }
.feedback.good .fb-score b { color: var(--good); } .feedback.part .fb-score b { color: var(--part); } .feedback.bad .fb-score b { color: var(--bad); }
.feedback table { background: var(--surface); border-radius: var(--r); }
.explain { max-width: 72ch; }
.fb-part { display: flex; flex-direction: column; gap: 4px; }
.q-actions { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--paper); padding-block: 10px; border-top: 1px solid var(--rule); }
.confirm { background: var(--surface); border: 1px solid var(--accent); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }

.rev { border: 1px solid var(--rule); border-left: 4px solid var(--good); border-radius: var(--r); padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
.rev.bad { border-left-color: var(--bad); }
.rev summary { cursor: pointer; }
.rev[open] { display: flex; }
.rev .q { margin-top: 10px; }
.rev .feedback { margin-top: 10px; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<div class="top"><div class="top-in">
  <div class="brand">PSA Resit Trainer <small>Prescribing Safety Assessment</small></div>
  <div id="countdown"></div>
</div></div>
<div class="shell">
  <nav id="nav" aria-label="Course days"></nav>
  <main id="app"></main>
</div>

<script src="data/questions.js"></script>
<script src="data/days.js"></script>
<script src="app.js"></script>
